<!-- APRENDIZAJES DEL QUIZ DEL HTML-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <h1>
            <strong>Página de Prueba</strong>
        </h1>
        <h2>
            <table>
                <tr>Es insertar una fila</tr>
                <td>Es un dato de tabla</td>
                    
            </table>
        </h2>
        <h3>
            <!-- Para hacer una lista ordenada por numeros o letras usas "ol", para hacer una desordenada usas "ul"-->
            <ul>
                <li>Planta</li>
                <li>Agua</li>
                <li>Fuego</li>
            </ul>

            <ol>
                <li>Squirtle</li>
                <li>Wartotle</li>
                <li>Blastoise</li>
            </ol>
            
            <!-- De esta Forma puedes hacer inputs, uno para presionar casilla y otro para escribir -->
            <input type="text">¿Qué Pokémon es tu favorito?</input>
            <input type="checkbox"> Tas Seguro?</input>
            <div>
                <select name="Estadísticas" id="nose">
                    <option value="Velocidad">Velocidad</option>
                    <option value="PS">PS</option>
                    <option value="Ataque">Ataque</option>
                    <option value="Precision">Precision</option>
                </select>
            </div>
            
            <textarea>
                Pues mira ty
            </textarea>
        </h3>
        <h4>
            <!-- Cuando a un Enlace le colocas target="_blank" hará una nueva pestaña cada vez que lo presiones-->
            <a href="url" target="_blank">¿Qué Será?</a>
            <!-- Si colocaras target="new" o cualquier otro nombre, te abrira una nueva pestaña
                 Pero al presionar el enlace de nuevo te dirigira a la misma si sigue abierta
                 No hará una Nueva cada vez 
            -->
        </h4>
    </head>
    <body>
        <a href="url" target="new"></a>
    </body>
</html>
